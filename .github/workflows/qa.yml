name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run editor:build -- --mode qa
      # Usa exactamente playwright-core 1.61.1, fijado por package.json y package-lock.json.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run qa:run
