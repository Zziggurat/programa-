name: Pruebas

on:
  pull_request:
  push:
    branches: [main]

# Un commit nuevo vuelve obsoleto el workflow anterior. GitHub lo mostrará como cancelado por
# concurrencia, distinto de un job que alcance su timeout propio.
concurrency:
  group: pruebas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    name: Unit / TypeScript / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run editor:build -- --mode qa

  qa-gate:
    name: QA Gate navegador
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run editor:build -- --mode qa
      # Exactamente playwright-core 1.61.1, fijado por package.json y package-lock.json.
      - run: npx playwright-core install --with-deps chromium
      - run: npm run qa:run

  qa-v6:
    name: QA equipos y diagnóstico V6
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      - run: npm run editor:build -- --mode qa
      - run: npx playwright-core install --with-deps chromium
      # Gate V6 separado: no infla ni redefine las 13 suites históricas.
      - run: npm run qa:equipos:run

  entrega:
    name: Entregable offline
    # Plataforma y runtime canónicos del HTML offline/desktop versionado.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci
      # Reconstruye en temporal y compara; no modifica el checkout ni tapa un HTML obsoleto.
      - run: npm run entrega:check
      - run: npx playwright-core install chromium
      - run: npm run qa:empaquetado
      - uses: actions/upload-artifact@v4
        with:
          name: TableroStudio-${{ github.sha }}
          path: dist-final/TableroStudio.html
          if-no-files-found: error
          retention-days: 14
