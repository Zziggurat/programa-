name: Construir instaladores

# Genera los instaladores de escritorio (Windows .exe, macOS .dmg, Linux AppImage)
# y el HTML autocontenido. Se ejecuta al crear una etiqueta v* o manualmente.
#
# SEGUNDA AUDITORÍA, TS2-P2-09. Esto compilaba y PUBLICABA sin ejecutar el typecheck, ni las
# pruebas de núcleo, ni una sola suite de navegador. O sea que una etiqueta `v*` sacaba
# instaladores de una versión que nadie había comprobado, y el `if-no-files-found: warn` dejaba
# además que un trabajo terminase en verde habiendo publicado cero archivos.
#
# Ahora hay una puerta: si `comprobar` no pasa, no se construye nada.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------------------
  # 1. LA PUERTA. Una sola vez, en Linux, porque el núcleo no depende del sistema.
  # ---------------------------------------------------------------------------------------
  comprobar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # Detecta antes de generar: el artefacto versionado debe corresponder ya a este commit.
      - run: npm run entrega:check
      # Typecheck de la app y del núcleo, y las pruebas de núcleo. Es lo que corre en segundos y
      # caza lo que de verdad no puede salir: un motor eléctrico que da otro número.
      - run: npm run check
      - run: npm test

      # El navegador de las pruebas, FIJADO. Tercera auditoría, TS3-P2-05: `npx playwright install`
      # resolvía el paquete `playwright` —que no está en el lock, donde solo hay `playwright-core`—
      # así que cada ejecución podía bajarse una versión distinta. Una batería que no corre dos
      # veces sobre lo mismo no sirve para comparar.
      - run: npx playwright-core install --with-deps chromium

      # Y la REGRESIÓN CRÍTICA, no solo el empaquetado. Antes la puerta corría dos suites; las que
      # cubren lo que de verdad no puede salir roto —recuperación del guardado, datos del proyecto,
      # texto hostil, entradas hostiles, el puente eléctrico— no entraban.
      - run: npm run qa
      - run: npm run empaquetar
      - run: node qa/entrega.mjs
      - run: node qa/empaquetado.mjs

      # El resumen de dependencias va con el release, para que se pueda comparar entre versiones.
      - run: npm audit --omit=dev --json > auditoria-dependencias.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: auditoria-dependencias
          path: auditoria-dependencias.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------
  # 2. Los instaladores, solo si la puerta pasó.
  # ---------------------------------------------------------------------------------------
  construir:
    needs: comprobar
    strategy:
      matrix:
        include:
          - os: windows-latest
            comando: dist:win
          - os: macos-latest
            comando: dist:mac
          - os: ubuntu-latest
            comando: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Compilar el núcleo + la app web y empaquetar el HTML autocontenido.
      - run: npm ci
      - run: npm run editor:build
      - run: node app/empaquetar.mjs

      # 2. Construir el instalador de escritorio para la plataforma actual.
      #    `npm ci` también aquí: con `npm install` y sin lockfile, cada plataforma podía
      #    resolver una versión distinta de Electron y publicarse tres instaladores que no son
      #    la misma aplicación.
      - working-directory: desktop
        run: npm ci
      - working-directory: desktop
        run: npm run ${{ matrix.comando }}

      # 3. Publicar los artefactos (instaladores + HTML).
      #    `error` y no `warn`: un trabajo que termina en verde sin haber subido nada es un
      #    release que parece hecho y no existe.
      - uses: actions/upload-artifact@v4
        with:
          name: TableroStudio-${{ matrix.os }}
          path: |
            desktop/instaladores/*.exe
            desktop/instaladores/*.dmg
            desktop/instaladores/*.AppImage
            dist-final/TableroStudio.html
          if-no-files-found: error
